<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f" />
    </marker>
  </defs>

  <!-- Array Container -->
  <!-- Cell 0 -->
  <rect x="50" y="50" width="80" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" />
  <text x="90" y="80" font-family="monospace" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#333">12</text>
  <text x="90" y="40" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#666">0</text>

  <!-- Cell 1 -->
  <rect x="130" y="50" width="80" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" />
  <text x="170" y="80" font-family="monospace" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#333">99</text>
  <text x="170" y="40" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#666">1</text>

  <!-- Cell 2 -->
  <rect x="210" y="50" width="80" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" />
  <text x="250" y="80" font-family="monospace" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#333">37</text>
  <text x="250" y="40" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#666">2</text>

  <!-- Cell 3 (Empty/Future) -->
  <rect x="290" y="50" width="80" height="60" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <text x="330" y="40" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#666">3</text>
  
  <!-- Annotations -->
  <text x="50" y="130" font-family="sans-serif" font-size="16" fill="#d32f2f" font-weight="bold">list[0]</text>
  <line x1="90" y1="115" x2="90" y2="85" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Memory Block Label -->
  <text x="400" y="85" font-family="sans-serif" font-size="14" fill="#666">Contiguous Memory Block</text>
</svg>